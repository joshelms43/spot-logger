<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Spot Logger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }

  #map { width: 100%; height: 100vh; }

  #panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -2px 20px rgba(0,0,0,0.12);
    z-index: 1000;
    transition: transform 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
  }

  #panel-handle {
    width: 36px; height: 4px;
    background: #ddd; border-radius: 2px;
    margin: 12px auto 0;
  }

  #tabs {
    display: flex;
    border-bottom: 1px solid #eee;
    margin: 12px 16px 0;
  }

  .tab {
    flex: 1; padding: 10px 0; text-align: center;
    font-size: 14px; font-weight: 500; color: #888;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: #1D9E75; border-bottom-color: #1D9E75; }

  #tab-add, #tab-list { padding: 16px; display: none; }
  #tab-add.active, #tab-list.active { display: block; }

  label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }

  input[type=text], textarea, select {
    width: 100%; padding: 10px 12px;
    border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; background: #fafafa;
    -webkit-appearance: none;
  }
  textarea { height: 70px; resize: none; }

  .stars { display: flex; gap: 6px; margin-top: 4px; }
  .star { font-size: 28px; color: #ddd; cursor: pointer; }
  .star.on { color: #EF9F27; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-top: 4px;
  }
  .type-btn {
    padding: 8px 4px; border-radius: 10px;
    border: 1.5px solid #eee; background: #fafafa;
    font-size: 12px; text-align: center; cursor: pointer; color: #555;
  }
  .type-btn.active { border-color: #1D9E75; background: #e1f5ee; color: #0F6E56; font-weight: 500; }

  #add-btn {
    width: 100%; padding: 14px;
    background: #1D9E75; color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 500;
    cursor: pointer; margin-top: 16px;
  }

  #loc-status { font-size: 12px; color: #888; margin-top: 8px; text-align: center; }

  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid #ddd; background: #fafafa;
    font-size: 13px; cursor: pointer; color: #555;
  }
  .filter-btn.active { background: #1D9E75; border-color: #1D9E75; color: #fff; }

  .filter-label { font-size: 12px; color: #888; margin-bottom: 6px; margin-top: 10px; }
  .filter-label:first-child { margin-top: 0; }

  .spot-card {
    background: #fafafa; border: 1px solid #eee;
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer;
  }
  .spot-card:active { background: #f0f0f0; }
  .spot-name { font-size: 15px; font-weight: 500; }
  .spot-meta { font-size: 12px; color: #888; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .spot-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .spot-stars { color: #EF9F27; font-size: 12px; }

  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 30px 0; }

  #locate-btn {
    position: absolute; top: 16px; right: 16px; z-index: 999;
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<div id="map"></div>
<button id="locate-btn" onclick="flyToUser()">📍</button>

<div id="panel">
  <div id="panel-handle"></div>
  <div id="tabs">
    <div class="tab active" onclick="switchTab('add')">Add spot</div>
    <div class="tab" onclick="switchTab('list')">My spots</div>
  </div>

  <div id="tab-add" class="active">
    <label>Name</label>
    <input type="text" id="spotName" placeholder="e.g. Sunrise Rock">

    <label>Type</label>
    <div class="type-grid" id="typeGrid"></div>

    <label>Rating</label>
    <div class="stars" id="stars"></div>

    <label>Notes (optional)</label>
    <textarea id="spotNote" placeholder="What makes it special?"></textarea>

    <div id="loc-status">Getting your location...</div>
    <button id="add-btn" onclick="addSpot()">Drop pin here</button>
  </div>

  <div id="tab-list">
    <div class="filter-label">Type</div>
    <div class="filters" id="typeFilters"></div>
    <div class="filter-label">Min rating</div>
    <div class="filters" id="ratingFilters"></div>
    <div id="spotList"></div>
  </div>
</div>

<script>
const TYPES = ['Viewpoint','Beach','Lookout','Waterfall','Bench','Bridge','Trail','Other'];
const TYPE_COLORS = { Viewpoint:'#378ADD', Beach:'#1D9E75', Lookout:'#D85A30', Waterfall:'#534AB7', Bench:'#888780', Bridge:'#BA7517', Trail:'#639922', Other:'#D4537E' };

let map, userLat = -26.65, userLon = 153.09, userMarker;
let spots = JSON.parse(localStorage.getItem('spots') || '[]');
let markers = [];
let selectedType = 'add', currentRating = 0, selectedSpotType = 'Viewpoint';
let filterType = 'all', filterRating = 0;

map = L.map('map', { zoomControl: false }).setView([userLat, userLon], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

userMarker = L.circleMarker([userLat, userLon], { radius: 8, fillColor: '#378ADD', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map).bindPopup('You');

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    userMarker.setLatLng([userLat, userLon]);
    document.getElementById('loc-status').textContent = 'Location ready';
  }, () => {
    document.getElementById('loc-status').textContent = 'Location unavailable';
  }, { enableHighAccuracy: true });
}

function flyToUser() {
  map.flyTo([userLat, userLon], 15);
}

const typeGrid = document.getElementById('typeGrid');
TYPES.forEach(t => {
  const b = document.createElement('div');
  b.className = 'type-btn' + (t === 'Viewpoint' ? ' active' : '');
  b.textContent = t;
  b.onclick = () => {
    document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    selectedSpotType = t;
  };
  typeGrid.appendChild(b);
});

const starsEl = document.getElementById('stars');
for (let i = 1; i <= 5; i++) {
  const s = document.createElement('span');
  s.className = 'star'; s.textContent = '★'; s.dataset.v = i;
  s.onclick = () => {
    currentRating = i;
    document.querySelectorAll('.star').forEach(st => st.classList.toggle('on', parseInt(st.dataset.v) <= i));
  };
  starsEl.appendChild(s);
}

function buildFilters() {
  const tf = document.getElementById('typeFilters');
  tf.innerHTML = '';
  ['all', ...TYPES].forEach(t => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (t === filterType ? ' active' : '');
    b.textContent = t === 'all' ? 'All' : t;
    b.onclick = () => { filterType = t; document.querySelectorAll('#typeFilters .filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderList(); applyMarkers(); };
    tf.appendChild(b);
  });

  const rf = document.getElementById('ratingFilters');
  rf.innerHTML = '';
  [{label:'Any',val:0},{label:'3+',val:3},{label:'4+',val:4},{label:'5 only',val:5}].forEach(r => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (r.val === filterRating ? ' active' : '');
    b.textContent = r.label;
    b.onclick = () => { filterRating = r.val; document.querySelectorAll('#ratingFilters .filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderList(); applyMarkers(); };
    rf.appendChild(b);
  });
}

function addSpot() {
  const name = document.getElementById('spotName').value.trim();
  if (!name) { alert('Add a name!'); return; }
  if (!currentRating) { alert('Pick a star rating!'); return; }
  const spot = { id: Date.now(), name, type: selectedSpotType, rating: currentRating, note: document.getElementById('spotNote').value.trim(), lat: userLat, lon: userLon };
  spots.push(spot);
  localStorage.setItem('spots', JSON.stringify(spots));
  placeMarker(spot);
  renderList();
  applyMarkers();
  document.getElementById('spotName').value = '';
  document.getElementById('spotNote').value = '';
  currentRating = 0;
  document.querySelectorAll('.star').forEach(s => s.classList.remove('on'));
  map.flyTo([spot.lat, spot.lon], 15);
  switchTab('list');
}

function placeMarker(spot) {
  const color = TYPE_COLORS[spot.type] || '#888';
  const m = L.circleMarker([spot.lat, spot.lon], { radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(map);
  m.bindPopup(`<b>${spot.name}</b><br>${spot.type} · ${'★'.repeat(spot.rating)}${'☆'.repeat(5-spot.rating)}${spot.note?'<br><small>'+spot.note+'</small>':''}`);
  markers.push({ id: spot.id, marker: m, spot });
}

function applyMarkers() {
  markers.forEach(({marker, spot}) => {
    const show = (filterType==='all'||spot.type===filterType) && spot.rating>=filterRating;
    if (show) map.addLayer(marker); else map.removeLayer(marker);
  });
}

function renderList() {
  const filtered = spots.filter(s => (filterType==='all'||s.type===filterType) && s.rating>=filterRating).reverse();
  const el = document.getElementById('spotList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">No spots match your filters</div>'; return; }
  el.innerHTML = filtered.map(s => `
    <div class="spot-card" onclick="flyToSpot(${s.id})">
      <div class="spot-name">${s.name}</div>
      <div class="spot-meta">
        <span class="spot-dot" style="background:${TYPE_COLORS[s.type]||'#888'}"></span>
        ${s.type}
        <span class="spot-stars">${'★'.repeat(s.rating)}${'☆'.repeat(5-s.rating)}</span>
      </div>
      ${s.note ? `<div style="font-size:12px;color:#666;margin-top:4px;">${s.note}</div>` : ''}
    </div>
  `).join('');
}

function flyToSpot(id) {
  const m = markers.find(m => m.id === id);
  if (m) { map.flyTo([m.spot.lat, m.spot.lon], 16); m.marker.openPopup(); }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='add')||(i===1&&tab==='list')));
  document.getElementById('tab-add').classList.toggle('active', tab==='add');
  document.getElementById('tab-list').classList.toggle('active', tab==='list');
}

spots.forEach(placeMarker);
buildFilters();
renderList();
</script>
</body>
</html>
